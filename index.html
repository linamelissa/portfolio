<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lina Melissa Arndt · UX/UI Designerin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Lina Melissa Arndt · UX/UI Designerin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</helmet>

<div style="background:#fff;padding-top:92px">

  <div aria-hidden="true" style="position:fixed;top:0;left:0;right:0;height:3px;z-index:210;background:rgba(0,0,0,0.06)">
    <div id="scroll-progress" style="height:100%;width:100%;transform-origin:left;transform:scaleX(0);transition:transform .1s linear;background:linear-gradient(90deg,#2E9E63,#14562F)"></div>
  </div>

  <nav id="navDesktop" aria-label="Hauptnavigation" style="position:fixed;left:50%;top:18px;transform:translateX(-50%) scale({{ navScale }});transition:transform .32s cubic-bezier(.22,1,.36,1),box-shadow .32s ease,background .32s ease;z-index:200;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,0.62);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);box-shadow:0 1px 0 rgba(255,255,255,0.8) inset,0 0 0 1px rgba(0,0,0,0.06),0 14px 40px -14px rgba(0,0,0,0.26);max-width:calc(100vw - 24px)">
    <div style="display:flex;justify-content:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch">
      <ul style="display:flex;align-items:center;gap:2px">
        <li style="position:relative" title="Start">
          <a href="#top" aria-label="Start · Lina Melissa Arndt" style="display:flex;align-items:center;gap:9px;height:46px;padding:0 14px 0 11px;border-radius:16px;color:#0A0A0A;transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s ease" style-active="transform:scale(.94)" style-hover="background:#F0F0F2;color:#0A0A0A">
            <span aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#248453 0%,#14562F 100%);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:-0.02em;flex-shrink:0">LA</span>
            <span style="font-size:14.5px;font-weight:600;letter-spacing:-0.025em;white-space:nowrap">Lina Melissa Arndt</span>
          </a>
        </li>
        <li aria-hidden="true" style="width:1px;height:22px;background:rgba(0,0,0,0.09);margin:0 5px"></li>
        <li style="position:relative">
          <a href="#projekte" data-de="Projekte" data-en="Projects" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 16px;border-radius:16px;font-size:14.5px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),background .25s ease,color .25s ease;color:{{ navFgProjekte }};background:{{ navBgProjekte }}" style-active="transform:scale(.94)" style-hover="color:#0A0A0A;background:#F0F0F2">Projekte</a>
        </li>
        <li style="position:relative">
          <a href="#antrieb" data-de="Antrieb" data-en="Drive" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 16px;border-radius:16px;font-size:14.5px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),background .25s ease,color .25s ease;color:{{ navFgAntrieb }};background:{{ navBgAntrieb }}" style-active="transform:scale(.94)" style-hover="color:#0A0A0A;background:#F0F0F2">Antrieb</a>
        </li>
        <li style="position:relative">
          <a href="#expertise" data-de="Expertise" data-en="Expertise" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 16px;border-radius:16px;font-size:14.5px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),background .25s ease,color .25s ease;color:{{ navFgExpertise }};background:{{ navBgExpertise }}" style-active="transform:scale(.94)" style-hover="color:#0A0A0A;background:#F0F0F2">Expertise</a>
        </li>
        <li style="position:relative">
          <a href="#ueber-mich" data-de="Über mich" data-en="About me" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 16px;border-radius:16px;font-size:14.5px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),background .25s ease,color .25s ease;color:{{ navFgUeberMich }};background:{{ navBgUeberMich }}" style-active="transform:scale(.94)" style-hover="color:#0A0A0A;background:#F0F0F2">Über mich</a>
        </li>
        <li style="position:relative">
          <a href="#blog" data-de="Blog" data-en="Blog" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 16px;border-radius:16px;font-size:14.5px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),background .25s ease,color .25s ease;color:{{ navFgBlog }};background:{{ navBgBlog }}" style-active="transform:scale(.94)" style-hover="color:#0A0A0A;background:#F0F0F2">Blog</a>
        </li>
        <li style="position:relative">
          <a href="#zwischendurch" data-de="Zwischendurch" data-en="In between" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 16px;border-radius:16px;font-size:14.5px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1),background .25s ease,color .25s ease;color:{{ navFgMehr }};background:{{ navBgMehr }}" style-active="transform:scale(.94)" style-hover="color:#0A0A0A;background:#F0F0F2">Zwischendurch</a>
        </li>
        <li aria-hidden="true" style="width:1px;height:22px;background:rgba(0,0,0,0.09);margin:0 5px"></li>
        <li style="position:relative">
          <a href="#kontakt" data-de="Kontakt" data-en="Contact" style="display:flex;align-items:center;justify-content:center;height:46px;padding:0 20px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#248453 0%,#14562F 100%);box-shadow:0 2px 8px rgba(46,139,87,0.3);font-size:14.5px;font-weight:600;letter-spacing:-0.01em;white-space:nowrap;transition:transform .2s cubic-bezier(.22,1,.36,1)" style-active="transform:scale(.94)" style-hover="color:#fff;filter:brightness(1.08)">Kontakt</a>
        </li>
        <li style="position:relative">
          <button type="button" onClick="{{ toggleLang }}" aria-label="Sprache wechseln" style="display:flex;align-items:center;justify-content:center;height:46px;width:46px;border:none;background:transparent;border-radius:16px;color:#6E6E73;font-size:13px;font-weight:600;letter-spacing:0.01em;cursor:pointer;font-family:inherit;transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s ease,color .2s ease" style-active="transform:scale(.9)" style-hover="color:#0A0A0A;background:#F0F0F2">
            <sc-if value="{{ isDe }}" hint-placeholder-val="{{ true }}"><span>EN</span></sc-if>
            <sc-if value="{{ isEn }}" hint-placeholder-val="{{ false }}"><span>DE</span></sc-if>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div id="navMobileWrap" style="display:none;position:fixed;left:50%;top:14px;transform:translateX(-50%) scale({{ navScale }});transition:transform .32s cubic-bezier(.22,1,.36,1);z-index:200;width:calc(100vw - 28px)">

    <div style="display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px 0 14px;border-radius:999px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 0 0 1px rgba(0,0,0,.06),0 14px 40px -14px rgba(0,0,0,.26)">

      <a href="#top" aria-label="Start · Lina Melissa Arndt" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:#0A0A0A">
        <span aria-hidden="true" style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;flex-shrink:0;background:linear-gradient(135deg,#248453 0%,#14562F 100%);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:-0.02em">LA</span>
        <span style="font-size:14px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap">Lina Melissa Arndt</span>
      </a>

      <div style="display:flex;align-items:center;gap:2px;flex-shrink:0">
        <button type="button" onClick="{{ toggleLang }}" aria-label="Sprache wechseln" style="width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#6E6E73;font-size:12.5px;font-weight:600;letter-spacing:0.01em;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ isDe }}" hint-placeholder-val="{{ true }}"><span>EN</span></sc-if>
          <sc-if value="{{ isEn }}" hint-placeholder-val="{{ false }}"><span>DE</span></sc-if>
        </button>

        <button type="button" onClick="{{ toggleMobileNav }}" aria-label="Menü öffnen" aria-expanded="{{ mobileNavOpen }}" style="width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#0A0A0A;cursor:pointer;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7" style="transform-origin:12px 7px;transition:transform .32s cubic-bezier(.65,0,.35,1);transform:{{ burgerLine1 }}"></line>
            <line x1="4" y1="12" x2="20" y2="12" style="transition:opacity .18s ease;opacity:{{ burgerLine2Opacity }}"></line>
            <line x1="4" y1="17" x2="20" y2="17" style="transform-origin:12px 17px;transition:transform .32s cubic-bezier(.65,0,.35,1);transform:{{ burgerLine3 }}"></line>
          </svg>
        </button>
      </div>

    </div>

  </div>

  <div aria-hidden="{{ mobileNavClosed }}" style="position:fixed;inset:0;z-index:300;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(32px);backdrop-filter:saturate(180%) blur(32px);display:flex;flex-direction:column;opacity:{{ navOverlayOpacity }};transition:opacity .28s ease;pointer-events:{{ navOverlayPointerEvents }}">

    <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:24px 20px 0;flex-shrink:0">
      <span aria-hidden="true" style="width:38px;height:38px"></span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <span style="font-size:18px;font-weight:700;letter-spacing:-0.025em;color:#0A0A0A">Lina Melissa Arndt</span>
        <span data-de="UX/UI Designerin" data-en="UX/UI Designer" style="font-size:12.5px;font-weight:500;letter-spacing:-0.01em;color:#6E6E73">UX/UI Designerin</span>
      </div>
      <button type="button" onClick="{{ closeMobileNav }}" aria-label="Menü schließen" style="width:38px;height:38px;border-radius:50%;border:0;background:rgba(10,10,10,.06);color:#0A0A0A;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .25s cubic-bezier(.22,1,.36,1);transform:{{ closeBtnTransform }}">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <nav aria-label="Mobile Hauptnavigation" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px">
      <a href="#projekte" onClick="{{ closeMobileNav }}" data-de="Projekte" data-en="Projects" style="font-size:23px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;padding:9px 0;color:{{ navFgProjekte }}">Projekte</a>
      <a href="#antrieb" onClick="{{ closeMobileNav }}" data-de="Antrieb" data-en="Drive" style="font-size:23px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;padding:9px 0;color:{{ navFgAntrieb }}">Antrieb</a>
      <a href="#expertise" onClick="{{ closeMobileNav }}" data-de="Expertise" data-en="Expertise" style="font-size:23px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;padding:9px 0;color:{{ navFgExpertise }}">Expertise</a>
      <a href="#ueber-mich" onClick="{{ closeMobileNav }}" data-de="Über mich" data-en="About me" style="font-size:23px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;padding:9px 0;color:{{ navFgUeberMich }}">Über mich</a>
      <a href="#blog" onClick="{{ closeMobileNav }}" data-de="Blog" data-en="Blog" style="font-size:23px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;padding:9px 0;color:{{ navFgBlog }}">Blog</a>
      <a href="#zwischendurch" onClick="{{ closeMobileNav }}" data-de="Zwischendurch" data-en="In between" style="font-size:23px;font-weight:700;letter-spacing:-0.02em;text-decoration:none;padding:9px 0;color:{{ navFgMehr }}">Zwischendurch</a>
      <a href="#kontakt" onClick="{{ closeMobileNav }}" data-de="Kontakt" data-en="Contact" style="margin-top:14px;display:flex;align-items:center;justify-content:center;padding:13px 34px;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:-0.01em;text-decoration:none;color:#fff;background:linear-gradient(135deg,#248453 0%,#14562F 100%);box-shadow:0 8px 22px -8px rgba(31,122,69,.6)">Kontakt</a>
    </nav>

    <div style="flex-shrink:0;display:flex;flex-direction:column;align-item
